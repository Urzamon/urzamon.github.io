<!-- Carrito de Compras -->
<div class="carrito-overlay" id="carrito-overlay"></div>
<div class="carrito-panel" id="carrito-panel">
    <div class="carrito-header">
        <h3>Tu Carrito</h3>
        <button class="carrito-cerrar" id="carrito-cerrar">
            <i class="bi bi-x"></i>
        </button>
    </div>
    <div id="carrito-lista"></div>
    <div class="carrito-total">
        Total: <span id="carrito-total">0€</span>
    </div>
    <div class="carrito-buttons">
        <button class="carrito-enviar" onclick="carrito.enviarPedido()">
            <i class="bi bi-send"></i>
            Enviar Pedido
        </button>
        <button class="carrito-vaciar" onclick="carrito.vaciarCarrito()">
            <i class="bi bi-trash"></i>
            Vaciar Carrito
        </button>
    </div>
</div>

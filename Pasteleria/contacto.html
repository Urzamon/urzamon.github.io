<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Dulce Tentación</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Firebase UI -->
    <script src="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.js"></script>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css" />
    <!-- Navbar Script (debe ir después de Firebase) -->
    <script src="js/navbar.js" defer></script>
    <!-- Carrito Script -->
    <script src="js/carrito.js" defer></script>
    <style>
        .contacto-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .contacto-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .contacto-info {
            background: var(--light-color);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .contacto-info h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .contacto-info p {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contacto-info i {
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .formulario-contacto {
            background: var(--light-color);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .formulario-contacto h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-group textarea {
            height: 150px;
            resize: vertical;
        }

        .mapa {
            margin-top: 2rem;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .mapa iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        .notificacion {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.5s ease-out;
        }

        .notificacion.success {
            background-color: #4CAF50;
        }

        .notificacion.error {
            background-color: #f44336;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .contacto-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }

        .btn-whatsapp i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- Contenedor del menú de navegación -->
    <div id="navbar-container"></div>

    <!-- Incluir componentes comunes -->
    <div id="carrito-container"></div>

    <div class="contacto-container">
        <h1>Contacto</h1>
        <p>Estamos aquí para ayudarte con tu pedido especial</p>

        <div class="contacto-grid">
            <div class="contacto-info">
                <h3>Información de Contacto</h3>
                <p><i class="bi bi-geo-alt"></i> Calle Principal 123, Madrid</p>
                <p><i class="bi bi-telephone"></i> 123-456-789</p>
                <p><i class="bi bi-envelope"></i> info@divinatarta.com</p>
                <p><i class="bi bi-clock"></i> Lunes - Viernes: 9:00 - 20:00</p>
                <p><i class="bi bi-clock"></i> Sábados: 9:00 - 18:00</p>
                <p><i class="bi bi-clock"></i> Domingos: Cerrado</p>
            </div>

            <div class="formulario-contacto">
                <h3>Envíanos un Mensaje</h3>
                <form id="contacto-form" onsubmit="return false;">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" required></textarea>
                    </div>
                    <div class="form-buttons">
                        <button type="button" onclick="enviarEmail()" class="btn-primary">Enviar Email</button>
                        <button type="button" onclick="enviarWhatsApp()" class="btn-whatsapp">
                            <i class="bi bi-whatsapp"></i> Enviar por WhatsApp
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="mapa">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3037.4284901456037!2d-3.7037903!3d40.4167754!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd42287e472b3f81%3A0x9a24bd0e3a0655c2!2sPuerta%20del%20Sol%2C%20Madrid!5e0!3m2!1ses!2ses!4v1647881234567!5m2!1ses!2ses" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // Cargar componentes comunes
        document.addEventListener('DOMContentLoaded', async function() {
            // Cargar el carrito
            const carritoResponse = await fetch('components/carrito.html');
            const carritoHtml = await carritoResponse.text();
            document.getElementById('carrito-container').innerHTML = carritoHtml;
        });

        // Función para enviar email
        function enviarEmail() {
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;
            const mensaje = document.getElementById('mensaje').value;

            if (!nombre || !email || !mensaje) {
                alert('Por favor, completa los campos requeridos');
                return;
            }

            // Aquí iría la lógica para enviar el email
            mostrarNotificacion('Mensaje enviado correctamente', 'success');
            document.getElementById('contacto-form').reset();
        }

        // Función para enviar WhatsApp
        function enviarWhatsApp() {
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const mensaje = document.getElementById('mensaje').value;

            if (!nombre || !mensaje) {
                alert('Por favor, completa los campos requeridos');
                return;
            }

            const mensajeWhatsApp = `Hola, soy ${nombre}. ${mensaje}`;
            const url = `https://wa.me/34123456789?text=${encodeURIComponent(mensajeWhatsApp)}`;
            window.open(url, '_blank');
        }

        // Función para mostrar notificaciones
        function mostrarNotificacion(mensaje, tipo) {
            const notificacion = document.createElement('div');
            notificacion.className = `notificacion ${tipo}`;
            notificacion.textContent = mensaje;
            document.body.appendChild(notificacion);

            setTimeout(() => {
                notificacion.remove();
            }, 3000);
        }
    </script>
</body>
</html>

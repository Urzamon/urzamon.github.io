<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Dulce Tentación</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Lightbox CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Firebase UI -->
    <script src="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.js"></script>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css" />
    <!-- Navbar Script (debe ir después de Firebase) -->
    <script src="js/navbar.js" defer></script>
    <!-- Carrito Script -->
    <script src="js/carrito.js" defer></script>
</head>
<body>
    <!-- Contenedor del menú de navegación -->
    <div id="navbar-container"></div>

    <!-- Incluir componentes comunes -->
    <div id="carrito-container"></div>

    <div class="galeria-container">
        <h1>Galería de Creaciones</h1>
        <p>Descubre nuestras mejores creaciones y momentos especiales</p>

        <div class="galeria-filtros">
            <button class="filtro-btn active" data-filter="todos">Todos</button>
            <button class="filtro-btn" data-filter="bodas">Bodas</button>
            <button class="filtro-btn" data-filter="cumpleanos">Cumpleaños</button>
            <button class="filtro-btn" data-filter="eventos">Eventos</button>
        </div>

        <div class="galeria-grid">
            <a href="img/galeria/boda1.jpg" data-lightbox="galeria" data-title="Pastel de Boda Clásico" class="galeria-item" data-categoria="bodas">
                <img src="img/galeria/boda1.jpg" alt="Pastel de Boda">
                <div class="galeria-item-info">
                    <h3>Pastel de Boda Clásico</h3>
                    <p>Diseño elegante con flores naturales</p>
                </div>
            </a>

            <a href="img/galeria/cumple1.jpg" data-lightbox="galeria" data-title="Pastel de Cumpleaños" class="galeria-item" data-categoria="cumpleanos">
                <img src="img/galeria/cumple1.jpg" alt="Pastel de Cumpleaños">
                <div class="galeria-item-info">
                    <h3>Pastel de Cumpleaños</h3>
                    <p>Diseño colorido y festivo</p>
                </div>
            </a>

            <a href="img/galeria/evento1.jpg" data-lightbox="galeria" data-title="Pastel para Evento" class="galeria-item" data-categoria="eventos">
                <img src="img/galeria/evento1.jpg" alt="Pastel para Evento">
                <div class="galeria-item-info">
                    <h3>Pastel para Evento</h3>
                    <p>Diseño moderno y minimalista</p>
                </div>
            </a>

            <!-- Agregar más imágenes según sea necesario -->
        </div>
    </div>

    <script>
        // Cargar componentes comunes
        document.addEventListener('DOMContentLoaded', async function() {
            // Cargar el carrito
            const carritoResponse = await fetch('components/carrito.html');
            const carritoHtml = await carritoResponse.text();
            document.getElementById('carrito-container').innerHTML = carritoHtml;
        });

        // Menú móvil
        document.querySelector('.menu-toggle').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
        });

        // Carrito
        const carritoPanel = document.getElementById('carrito-panel');
        const carritoOverlay = document.getElementById('carrito-overlay');
        const carritoToggle = document.getElementById('carrito-toggle');
        const carritoCerrar = document.getElementById('carrito-cerrar');

        function toggleCarrito() {
            carritoPanel.classList.toggle('active');
            carritoOverlay.classList.toggle('active');
        }

        carritoToggle.addEventListener('click', toggleCarrito);
        carritoCerrar.addEventListener('click', toggleCarrito);
        carritoOverlay.addEventListener('click', toggleCarrito);

        // Filtros de galería
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Actualizar botones activos
                document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Filtrar imágenes
                const categoria = this.dataset.filter;
                document.querySelectorAll('.galeria-item').forEach(item => {
                    if (categoria === 'todos' || item.dataset.categoria === categoria) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // Configuración de Lightbox
        lightbox.option({
            'resizeDuration': 200,
            'wrapAround': true,
            'albumLabel': 'Imagen %1 de %2'
        });
    </script>
</body>
</html>
